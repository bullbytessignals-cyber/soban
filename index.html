<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheCarders | Premium Flash USDT & Cards</title>
  <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a0370e19ad1aafa53a44bdc/99f6ce9bb_logo.png">
  
  <!-- Typography & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <!-- Background grids & glows -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- Main Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="#/" class="logo-link">
        <div class="logo-icon" style="color: #17cf73; background-color: transparent; border: none; width: auto; height: auto; padding: 0;">
          <i data-lucide="shield" class="animate-pulse" style="width: 1.5rem; height: 1.5rem;"></i>
        </div>
        <span class="logo-text" style="color: #fff;">The<span class="text-primary text-glow">CA4DERS</span></span>
      </a>
      
      <nav class="main-nav">
        <a href="#/" class="nav-item active" data-route="home">
          <i data-lucide="home" class="icon-sm"></i>
          <span>Home</span>
        </a>
        <a href="#/cards" class="nav-item" data-route="cards">
          <i data-lucide="credit-card" class="icon-sm"></i>
          <span>Cards</span>
        </a>
        <a href="#/products" class="nav-item" data-route="products">
          <i data-lucide="package" class="icon-sm"></i>
          <span>Products</span>
        </a>
        <a href="#/orders" class="nav-item" data-route="orders">
          <i data-lucide="shopping-bag" class="icon-sm"></i>
          <span>My Orders</span>
        </a>
        <a href="#/flash-usdt" class="nav-item" data-route="flash-usdt">
          <i data-lucide="zap" class="icon-sm"></i>
          <span>Flash USDT</span>
        </a>
        <a href="#/deposit" class="nav-item" data-route="deposit">
          <i data-lucide="arrow-down-circle" class="icon-sm"></i>
          <span>Deposit</span>
        </a>
        <a href="#/account" class="nav-item mobile-nav-account" data-route="account">
          <i data-lucide="user" class="icon-sm"></i>
          <span>My Account</span>
        </a>
        <button class="nav-item mobile-nav-login" id="mobile-nav-login-btn" onclick="app.openAuthModal()">
          <i data-lucide="log-in" class="icon-sm"></i>
          <span>Login / Register</span>
        </button>

      </nav>
      
      <!-- Hamburger Menu Toggle -->
      <div class="header-actions">
        <!-- Status Capsule -->
        <div class="status-capsule font-mono text-[9px] font-bold" style="background-color: hsla(var(--primary) / 0.05); border: 1px solid hsla(var(--primary) / 0.2); padding: 0.35rem 0.75rem; border-radius: 9999px; color: #17cf73; display: inline-flex; align-items: center; gap: 0.35rem;">
          <span style="display: inline-block; width: 5px; height: 5px; background-color: #17cf73; border-radius: 50%; box-shadow: 0 0 6px #17cf73;"></span>
          <span>ONLINE</span>
        </div>
        
        <!-- Balance Widget -->
        <div class="balance-widget hidden" id="balance-widget">
          <span class="balance-label">Balance:</span>
          <span class="balance-value text-glow" id="header-balance">$0.00</span>
          <a href="#/deposit" class="balance-add-btn"><i data-lucide="plus"></i></a>
        </div>
        
        <!-- Auth Button -->
        <button class="btn btn-secondary btn-sm" id="auth-btn" onclick="app.openAuthModal()">
          <i data-lucide="user" class="icon-sm"></i> <span>Login</span>
        </button>
        
        <!-- User Profile Dropdown (hidden by default) -->
        <div class="profile-dropdown hidden" id="profile-dropdown">
          <button class="profile-trigger" id="profile-trigger">
            <span class="profile-initials">US</span>
          </button>
          <div class="dropdown-menu">
            <div class="dropdown-header">
              <span class="user-email" id="dropdown-email">user@example.com</span>
              <span class="user-role badge badge-outline" id="dropdown-role">User</span>
            </div>
            <div class="dropdown-divider"></div>
            <a href="#/account" class="dropdown-item"><i data-lucide="user"></i> My Account</a>
            <a href="#/deposit" class="dropdown-item"><i data-lucide="wallet"></i> Deposit Funds</a>
            <a href="#/admin67" class="dropdown-item admin-only hidden"><i data-lucide="shield"></i> Admin Panel</a>
            <button class="dropdown-item text-destructive" onclick="app.logout()"><i data-lucide="log-out"></i> Log Out</button>
          </div>
        </div>
        
        <!-- Hamburger Menu Toggle -->
        <button class="hamburger-menu" id="hamburger-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Router Container -->
  <main class="app-main" id="app-router-view">
    <!-- Dynamic views will be rendered here by app.js -->
    <div class="loading-screen">
      <div class="spinner"></div>
      <p class="font-mono text-xs text-muted-foreground mt-4">Initializing Secure Environment...</p>
    </div>
  </main>

  <!-- Auth Modal (Login / Register) -->
  <div class="modal-overlay hidden" id="auth-modal">
    <div class="modal-container modal-sm">
      <div class="modal-header">
        <h3 class="font-heading font-bold" id="auth-title">Welcome Back</h3>
        <button class="modal-close" onclick="app.closeAuthModal()"><i data-lucide="x"></i></button>
      </div>
      
      <div class="modal-body">
        <form id="auth-form" onsubmit="app.handleAuthSubmit(event)">
          <div class="form-tabs">
            <button type="button" class="tab-btn active" id="tab-login" onclick="app.setAuthTab('login')">Login</button>
            <button type="button" class="tab-btn" id="tab-register" onclick="app.setAuthTab('register')">Register</button>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="auth-email">Email Address</label>
            <input type="email" id="auth-email" class="form-input" placeholder="name@domain.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="auth-password">Password</label>
            <input type="password" id="auth-password" class="form-input" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn btn-primary w-full font-bold glow-green mt-4" id="auth-submit-btn">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/966571188336" target="_blank" rel="noopener noreferrer" class="whatsapp-float" id="whatsapp-float" aria-label="Chat on WhatsApp">
    <i data-lucide="message-circle" class="whatsapp-float-icon"></i>
  </a>

  <!-- Mobile Menu Backdrop Overlay -->
  <div class="mobile-overlay" id="mobile-overlay"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
